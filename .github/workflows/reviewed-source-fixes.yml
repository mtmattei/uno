name: Apply reviewed App Anatomy source fixes
on:
  push:
    branches: [app-anatomy-mvp]
    paths: ['.github/workflows/reviewed-source-fixes.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: app-anatomy-mvp
      - name: Apply bounded reviewed edits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace_once(text, old, new):
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one source match: {old!r}')
              return text.replace(old, new, 1)
          path = Path('site/app.js')
          text = path.read_text()
          text = replace_once(text, "title='Reset this browser's progress?';", 'title="Reset this browser\'s progress?";')
          text = replace_once(text, 'lab={selected:component,tab:', 'lab={initialSelection:component,restoreSettings:{...progress.settings},selected:component,tab:')
          text = replace_once(text, 'const settings=progress.settings;', 'const settings=session.restoreSettings;')
          text = replace_once(text, "await send('select',session.selected);", "await send('select',session.initialSelection);")
          path.write_text(text)
          path = Path('src/Mise/WasmScripts/anatomy.js')
          text = path.read_text()
          text = replace_once(text, "dispatch(JSON.stringify({ action: 'snapshot' }));", "dispatch(JSON.stringify({ action: 'snapshot' }));\n      if (window.parent === window) dispatch(JSON.stringify({ action: 'mode', value: 'use' }));")
          path.write_text(text)
          PY
          node --check site/app.js
          node --check site/zip.js
          node --check src/Mise/WasmScripts/anatomy.js
      - name: Commit only the reviewed source files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/app.js src/Mise/WasmScripts/anatomy.js
          git commit -m 'Fix reset-dialog syntax, preserve lesson state, and support standalone app use [skip ci]'
          git push origin HEAD:app-anatomy-mvp
