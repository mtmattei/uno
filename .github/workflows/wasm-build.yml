name: App Anatomy WebAssembly build
on:
  push:
    branches: [app-anatomy-mvp]
permissions:
  contents: read
concurrency:
  group: anatomy-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: python3 scripts/fetch-assets.py
      - name: Preserve source artifact
        uses: actions/upload-artifact@v4
        with:
          name: anatomy-source
          include-hidden-files: true
          path: |
            src
            site
            scripts
            tests
            .github/workflows/wasm-build.yml
            .gitignore
            global.json
            NuGet.Config
            README.md
          retention-days: 14
      - run: node --check site/app.js && node --check site/zip.js
      - run: dotnet run --project tests/ModelTests/ModelTests.csproj
      - run: dotnet workload install wasm-tools --skip-manifest-update
      - run: dotnet publish src/Mise/Mise.csproj -f net10.0-browserwasm -c Release -o publish
      - run: python3 scripts/package_site.py
      - run: python3 -m pip install playwright==1.56.0
      - name: Browser acceptance checks
        id: browser
        run: python3 tests/test_web.py
      - name: Diagnose a failed startup
        if: failure() && steps.browser.outcome == 'failure'
        run: python3 tests/diagnose_startup.py
      - name: Save compiled site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-anatomy-site
          path: dist
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anatomy-qa
          path: qa
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy App Anatomy
        id: deployment
        uses: actions/deploy-pages@v4
